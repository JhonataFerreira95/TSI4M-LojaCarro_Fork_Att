spring.application.name=usuarios-service
server.port=${PORT:8081}

spring.datasource.url=${USUARIOS_DB_URL:jdbc:mysql://localhost:3306/usuarios}
spring.datasource.username=${USUARIOS_DB_USERNAME:root}
spring.datasource.password=${USUARIOS_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
